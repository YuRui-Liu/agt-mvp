<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>kuAI 模拟职位投递</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/application.js" defer></script>
</head>
<body>
  <main class="application-shell">
    <section class="panel application-card">
      <p class="step">LOCAL MOCK APPLICATION</p>
      <h1>让画像走向下一站</h1>
      <p class="muted">这是本地 Mock 投递页面，仅用于验证画像到投递的完整闭环，不代表真实招聘结果。</p>
      <div id="applicationStatus" class="status" aria-live="polite">请填写投递信息。</div>
      <div id="applicationError" class="error" role="alert" tabindex="-1" hidden></div>
      <form id="applicationForm">
        <label>姓名<input id="candidateName" autocomplete="name" maxlength="200" required></label>
        <label>邮箱<input id="candidateEmail" type="email" autocomplete="email" maxlength="320" required></label>
        <label>意向职位<input id="candidatePosition" maxlength="200" required></label>
        <button id="submitApplication" type="submit">提交模拟投递 →</button>
      </form>
    </section>
  </main>
</body>
</html>
